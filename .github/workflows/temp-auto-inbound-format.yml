name: Temporary Auto Inbound formatter
on:
  push:
    branches:
      - feat/auto-inbound-per-outbound
    paths:
      - .github/workflows/temp-auto-inbound-format.yml
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Format and emit source
        run: |
          cd frontend
          npx oxfmt src/pages/xray/outbounds/AutoInboundSettingsModal.tsx
          base64 -w0 src/pages/xray/outbounds/AutoInboundSettingsModal.tsx
