name: Manual Regenerate Codegen

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run npm run gen
        working-directory: frontend
        run: npm run gen

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git add -A
            git commit -m "chore: regenerate openapi/schemas (auto)"
            set +e
            out=$(git push origin HEAD:main 2>&1)
            code=$?
            echo "$out"
            if [ "$code" -ne 0 ]; then
              esc=$(echo "$out" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error ::git push failed: ${esc}"
              exit "$code"
            fi
          fi
