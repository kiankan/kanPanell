name: Temporary Auto Inbound formatter
on:
  pull_request:
    branches: [main]
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Print formatter diff
        run: |
          npx oxfmt src/pages/xray/outbounds/AutoInboundSettingsModal.tsx src/pages/xray/outbounds/OutboundsTab.tsx
          git diff -- src/pages/xray/outbounds/AutoInboundSettingsModal.tsx src/pages/xray/outbounds/OutboundsTab.tsx
        working-directory: frontend
