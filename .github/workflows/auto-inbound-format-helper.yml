name: Temporary Auto Inbound formatter
on:
  pull_request:
    branches: [main]
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Print formatter diff
        run: |
          npx oxfmt src/pages/xray/outbounds/AutoInboundSettingsModal.tsx src/pages/xray/outbounds/OutboundsTab.tsx src/pages/api-docs/endpoints.ts
          git diff -- src/pages/xray/outbounds/AutoInboundSettingsModal.tsx src/pages/xray/outbounds/OutboundsTab.tsx src/pages/api-docs/endpoints.ts
        working-directory: frontend

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Print Go formatter diff
        run: |
          go run mvdan.cc/gofumpt@latest -w internal/web/controller/auto_inbound.go internal/web/service/auto_inbound_tls.go internal/web/service/setting.go
          git diff -- internal/web/controller/auto_inbound.go internal/web/service/auto_inbound_tls.go internal/web/service/setting.go
